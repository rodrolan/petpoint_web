  <style>
    :root { --bg:#fff; --text:#000; --border:#000; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#000; --text:#fff; --border:#fff; }
    }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    body { background:var(--bg); color:var(--text); min-height:100vh; display:flex; justify-content:center; align-items:center; }
    .container { max-width:420px; width:100%; padding:32px 20px; text-align:center; }
    .logo { width:120px; height:120px; border-radius:50%; margin-bottom:18px; }
    .slogan { margin-bottom:28px; }
    .social-icons { display:flex; justify-content:center; gap:28px; margin-bottom:36px; }
    .social-icons a {
      color: var(--text);
      font-size: 1.6rem;
      transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      text-decoration: none;
    }

    .social-icons a:hover {
      transform: scale(1.2);
      opacity: 0.8;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .social-icons a:active {
      transform: scale(0.9);
    }
    .links { display:flex; flex-direction:column; gap:16px; }
    .link-button { padding:16px; border:2px solid var(--border); border-radius:999px; text-decoration:none; color:var(--text); font-weight:600; display:flex; justify-content:center; gap:12px; }

    function track(event) {
      if (typeof fbq !== 'undefined') fbq('trackCustom', event);
      if (typeof gtag !== 'undefined') gtag('event', event);
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
