<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet Point | Peluquería Canina</title>

  <!-- SEO LOCAL -->
  <meta name="description" content="Peluquería canina en Avilés, Asturias. Amor y estilo para tu peludo. Reserva tu cita por WhatsApp." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --border: #000000;
    }

    body.dark {
      --bg: #000000;
      --text: #ffffff;
      --border: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .toggle-theme {
      position: fixed;
      top: 16px;
      right: 16px;
      border: 2px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .container {
      max-width: 420px;
      width: 100%;
      padding: 32px 20px;
      text-align: center;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 18px;
    }

    .slogan {
      margin-bottom: 28px;
      font-size: 1.1rem;
      font-weight: 500;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 36px;
    }

    .social-icons a {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 1.4rem;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .social-icons a.instagram { background: #E1306C; color: #fff; }
    .social-icons a.whatsapp { background: #25D366; color: #fff; }
    .social-icons a.phone { background: #007AFF; color: #fff; }

    .social-icons a:hover {
      transform: scale(1.15);
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link-button {
      padding: 16px;
      border: 2px solid var(--border);
      border-radius: 999px;
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .link-button:hover {
      background: var(--text);
      color: var(--bg);
    }
  </style>
</head>
<body>

  <button class="toggle-theme" onclick="toggleTheme()">🌙 / ☀️</button>

  <div class="container">
    <img src="logo.png" alt="Pet Point" class="logo" />

    <p class="slogan">Amor y estilo para tu peludo 🐶✨</p>

    <div class="social-icons">
      <a href="https://instagram.com/petpoint.es" class="instagram"><i class="fab fa-instagram"></i></a>
      <a href="https://wa.me/34684622318" class="whatsapp"><i class="fab fa-whatsapp"></i></a>
      <a href="tel:+34684622318" class="phone"><i class="fas fa-phone"></i></a>
    </div>

    <div class="links">
      <a href="https://wa.me/34684622318" class="link-button"><i class="fas fa-calendar-check"></i>Reservar cita</a>
      <a href="https://instagram.com/petpoint.es" class="link-button"><i class="fab fa-instagram"></i>Instagram</a>
      <a href="https://maps.app.goo.gl/HBhJHxvmzoCAk48C7" class="link-button"><i class="fas fa-location-dot"></i>Ubicación</a>
    </div>
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark');
    }
  </script>

</body>
</html>
